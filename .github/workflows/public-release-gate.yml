name: Public Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  v1-core:
    name: v1-core
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out the public release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run the v1 public core
        run: npm run preflight:v1 -- --mode public-core

      - name: Reject tracked-file drift
        run: git diff --exit-code

  package-smoke:
    name: package-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out the public release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run the release-tarball smoke
        run: npm run preflight:v1 -- --mode package-smoke

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the public release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run unmounted and mounted Docker smoke
        run: npm run preflight:v1 -- --mode docker

  release-gate:
    name: release-gate
    if: always()
    needs: [v1-core, package-smoke, docker-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every v1 gate
        env:
          V1_CORE: ${{ needs.v1-core.result }}
          PACKAGE_SMOKE: ${{ needs.package-smoke.result }}
          DOCKER_SMOKE: ${{ needs.docker-smoke.result }}
        run: |
          test "$V1_CORE" = success
          test "$PACKAGE_SMOKE" = success
          test "$DOCKER_SMOKE" = success
