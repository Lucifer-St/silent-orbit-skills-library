name: V1 RC External Acceptance
description: Submit one original independent-user result for the v1 Release Candidate.
title: "[V1 RC acceptance]: "
labels: ["public-beta"]
body:
  - type: markdown
    attributes:
      value: "Use only the v0.11.0-beta.7 GitHub Pre-release checklist. Do not include raw logs, absolute paths, Skill names, prompts, private memories, or account data."
  - type: checkboxes
    id: independence
    attributes:
      label: Acceptance authority
      options:
        - label: I am a real independent user; this is my original result, not author dogfood, CI, a fixture, an automated agent, or a copied report.
          required: true
        - label: I completed the published 15–25 minute checklist in order.
          required: true
  - type: input
    id: environment
    attributes:
      label: OS family, architecture, and Node.js 24 version
      placeholder: "Windows x64, Node 24.x"
    validations:
      required: true
  - type: checkboxes
    id: core
    attributes:
      label: Core results
      options:
        - label: Release checksum matched SHA256SUMS.txt.
          required: true
        - label: Tarball installation and CLI 0.4.0 startup passed.
          required: true
        - label: Initial doctor produced an actionable result.
          required: true
        - label: Import, scan, analyze, diff, generate, final doctor, and audit passed.
          required: true
        - label: The second scan/diff was added 0, changed 0, removed 0.
          required: true
  - type: dropdown
    id: docker
    attributes:
      label: Docker unmounted and mounted scenarios
      options:
        - "Passed both scenarios"
        - "Not applicable to my environment"
        - "Failed or incomplete"
    validations:
      required: true
  - type: dropdown
    id: maintenance
    attributes:
      label: Controlled trusted-source maintenance
      options:
        - "Passed one reviewed skills@1.5.20 check-and-update batch"
        - "Not run"
        - "Failed or incomplete"
    validations:
      required: true
  - type: textarea
    id: receipt
    attributes:
      label: Privacy-safe automatic receipt
      description: Paste only silent-orbit-v1-acceptance-receipt.json after reviewing it.
      render: json
    validations:
      required: true
  - type: dropdown
    id: highest_severity
    attributes:
      label: Highest severity observed, including worked-around failures
      options:
        - "None"
        - "P2"
        - "P1"
        - "P0"
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Original observations and reproduction steps
      description: Describe what happened without private paths, names, prompts, or raw logs.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I reviewed the receipt and removed all private or identifying operational evidence.
          required: true
