name: V1 RC 外部验收 / External Acceptance
description: 提交一份真实独立用户完成的 v1 RC 原始验收结果。
title: "[V1 RC 验收]: "
labels: ["public-beta"]
body:
  - type: markdown
    attributes:
      value: "只使用 v0.11.0-beta.9 GitHub Pre-release 的公开清单。请勿提交原始日志、绝对路径、Skill 名称、提示词、私人记忆或账号数据。"
  - type: checkboxes
    id: independence
    attributes:
      label: 验收身份 / Acceptance authority
      options:
        - label: 我是真实独立用户；这是我的原始结果，不是作者自测、CI、测试夹具、纯自动 Agent 结果或复制来的报告。
          required: true
        - label: 我按顺序完成了公开的 15–25 分钟清单，并本人检查了结果。
          required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统、架构和 Node.js 24 版本
      placeholder: "Windows x64, Node 24.x"
    validations:
      required: true
  - type: checkboxes
    id: core
    attributes:
      label: 核心结果 / Core results
      options:
        - label: Release 文件校验值与 SHA256SUMS.txt 一致。
          required: true
        - label: 本地 tarball 安装成功，CLI 0.4.0 可启动。
          required: true
        - label: 第一次 doctor 给出了可理解、可行动的结果。
          required: true
        - label: import、scan、analyze、diff、generate、最终 doctor 和 audit 全部通过。
          required: true
        - label: 第二次 scan/diff 为 added 0、changed 0、removed 0。
          required: true
        - label: 我本人检查了生成网页的默认中文、语言切换、搜索、筛选和详情。
          required: true
  - type: dropdown
    id: docker
    attributes:
      label: Docker 未挂载与已挂载场景
      options:
        - "两个场景都通过 / Passed both"
        - "不适用于我的环境 / Not applicable"
        - "失败或未完成 / Failed or incomplete"
    validations:
      required: true
  - type: dropdown
    id: maintenance
    attributes:
      label: 受控可信来源维护
      options:
        - "本人确认后完成一批 skills@1.5.20 check-and-update"
        - "未运行 / Not run"
        - "失败或未完成 / Failed or incomplete"
    validations:
      required: true
  - type: textarea
    id: receipt
    attributes:
      label: 隐私安全自动回执
      description: 本人检查后，只粘贴 silent-orbit-v1-acceptance-receipt.json。
      render: json
    validations:
      required: true
  - type: dropdown
    id: highest_severity
    attributes:
      label: 观察到的最高严重度（包括后来绕过的问题）
      options:
        - "无 / None"
        - "P2"
        - "P1"
        - "P0"
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: 本人的原始观察与复现步骤
      description: 用自己的话描述发生了什么，不要包含私人路径、名称、提示词或原始日志。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私复核 / Privacy review
      options:
        - label: 我已检查回执，并移除所有私人信息或可识别个人的操作证据。
          required: true
