name: Customization RC 独立验收
description: 提交真实独立用户完成的个性化审美定制候选版原始验收结果。
title: "[Customization RC 验收]: "
labels: ["public-beta"]
body:
  - type: markdown
    attributes:
      value: "只有 Release operator 激活 v0.12.0-beta.1 的独立验收后才提交。请勿上传原始日志、绝对路径、Skill 名称、提示词、审美访谈原文、private state、receipt 或账号数据。"
  - type: checkboxes
    id: independence
    attributes:
      label: 验收身份
      options:
        - label: 我是真实独立用户；这不是作者自测、CI、fixture、纯自动 Agent 结果或复制来的报告。
          required: true
        - label: 我本人完成了公开的 20–30 分钟清单并检查了两个可操作方向。
          required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统、架构、Node.js 24 与使用的 Agent
      placeholder: "Windows x64, Node 24.x, Codex"
    validations:
      required: true
  - type: checkboxes
    id: core
    attributes:
      label: 核心结果
      options:
        - label: tarball SHA-256 通过，package 0.12.0-beta.1 与 CLI 0.5.0 一致。
          required: true
        - label: 生成结果包含有效 frontend-handoff.v2.json。
          required: true
        - label: 我看到了恰好两套功能完整、至少两个结构维度不同的方向。
          required: true
        - label: 两套方向都通过地图、目录、搜索、筛选、详情、双语、桌面与手机检查。
          required: true
        - label: 我至少执行了一次 adjust 或 reject，并最终执行 keep。
          required: true
        - label: 决定历史被保留，current 只在 keep 后出现。
          required: true
        - label: 数据刷新后 stylePreserved 为 true，customization doctor 为 ok。
          required: true
  - type: dropdown
    id: preference_match
    attributes:
      label: 选中方向与本人审美偏好的匹配度
      options:
        - "明显匹配 / Strong match"
        - "基本匹配 / Acceptable match"
        - "不匹配 / Poor match"
    validations:
      required: true
  - type: dropdown
    id: highest_severity
    attributes:
      label: 观察到的最高严重度
      options:
        - "无 / None"
        - "P2"
        - "P1"
        - "P0"
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: 本人的原始观察与最小复现步骤
      description: 用自己的话描述；不要包含任何私人数据或原始运行证据。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私复核
      options:
        - label: 我没有提交原始日志、绝对路径、私人 Skill 信息、提示词、访谈原文、private state、receipt 或账号信息。
          required: true
