name: Customization RC 独立验收
description: 提交真实独立用户完成的个性化审美定制候选版原始验收结果。
title: "[Customization RC 验收]: "
labels: ["public-beta"]
body:
  - type: markdown
    attributes:
      value: "本表绑定 v0.13.1-beta.1 / CLI 0.6.x。也可把单文件测试包生成且通过 validator 的 independent 报告直接发回项目所有者，作为本表的等价回执；这不代表已创建 GitHub Issue。请勿上传原始日志、绝对路径、Skill 名称、提示词、审美访谈原文、private state、receipt 或账号数据。"
  - type: checkboxes
    id: independence
    attributes:
      label: 验收身份
      options:
        - label: 我是真实独立用户；这不是作者自测、CI、fixture、纯自动 Agent 结果或复制来的报告。
          required: true
        - label: 我本人完成了公开的 20–30 分钟清单并检查了两个可操作方向。
          required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统、架构、Node.js 24 与使用的 Agent
      placeholder: "Windows x64, Node 24.x, Codex"
    validations:
      required: true
  - type: checkboxes
    id: core
    attributes:
      label: 核心结果
      options:
        - label: tarball SHA-256、package 版本与 operator 公布的新候选版一致，CLI 为 0.6.x。
          required: true
        - label: 生成结果包含有效 frontend-handoff.v2.json。
          required: true
        - label: 访谈前只读 preflight 用白话解释条件和边界；没有同意时未安装或写入，同意后只做项目级设置并复检。
          required: true
        - label: 访谈一次只问一个生活化问题，允许不知道/跳过/返回修改，确认页默认不暴露专业字段。
          required: true
        - label: 我看到了恰好两套功能完整、至少两个结构维度不同的方向。
          required: true
        - label: 两套方向都通过地图、目录、搜索、筛选、详情、双语、桌面与手机检查。
          required: true
        - label: 我至少执行了一次 adjust 或 reject，并最终执行 keep。
          required: true
        - label: 我的目录/地图首选真实控制首次打开、刷新、约 390px 手机与 keep 后默认视图；主动切换不会被立刻重置。
          required: true
        - label: 我执行了结构重做；新轮次改变了节点、分组、边或布局策略，不是只换 CSS。
          required: true
        - label: 决定历史被保留，current 只在 keep 后出现。
          required: true
        - label: 数据刷新后 stylePreserved 为 true，customization doctor 为 ok。
          required: true
  - type: dropdown
    id: preference_match
    attributes:
      label: 选中方向与本人审美偏好的匹配度
      options:
        - "明显匹配 / Strong match"
        - "基本匹配 / Acceptable match"
        - "不匹配 / Poor match"
    validations:
      required: true
  - type: dropdown
    id: highest_severity
    attributes:
      label: 观察到的最高严重度
      options:
        - "无 / None"
        - "P2"
        - "P1"
        - "P0"
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: 本人的原始观察与最小复现步骤
      description: 用自己的话描述；不要包含任何私人数据或原始运行证据。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私复核
      options:
        - label: 我没有提交原始日志、绝对路径、私人 Skill 信息、提示词、访谈原文、private state、receipt 或账号信息。
          required: true
